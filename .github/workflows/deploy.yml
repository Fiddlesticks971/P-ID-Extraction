name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/pid-tag-extraction-app-6aqes5]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Requires Pages to be enabled once by hand:
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      # The workflow token is not allowed to create the Pages site itself
      # ("Resource not accessible by integration"), so this cannot be
      # automated from here.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Project sites are served from /<repo>/, so the bundle needs that base.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
